name: Build Android AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          mkdir -p project_folder
          unzip -q Quran_Libya.zip -d project_folder

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build AAB
        run: |
          BUILD_FILE=$(find project_folder -name "build.gradle" -type f -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 7.5
          fi
          
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: '**/build/outputs/bundle/release/*.aab'
