name: Build Android AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          mkdir -p project_folder
          unzip -q Quran_Libya.zip -d project_folder

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Generate Wrapper and Build AAB
        run: |
          # العثور على مكان وجود ملف build.gradle داخل المشروع الفكوك
          BUILD_FILE=$(find project_folder -name "build.gradle" -type f -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # توليد ملفات التشغيل المفقودة تلقائياً
          gradle wrapper
          
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: '**/build/outputs/bundle/release/*.aab'
